# Local stack: PostgreSQL (with pgvector) + Node API + Python AI service.
#
#   docker compose up --build
#   # API on http://localhost:5000, Postgres on localhost:5432
#
# Then run the Vite client on the host (`cd client && npm run dev`) — it
# proxies /api to :5000. Secrets and LLM keys come from server/.env if it
# exists; everything needed to boot has a dev default below.
#
# Optional: `docker compose --profile monitoring up` also starts Prometheus,
# scraping the API's /metrics every 15 s (http://localhost:9090).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sankalp
      POSTGRES_PASSWORD: sankalp
      POSTGRES_DB: sankalp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sankalp -d sankalp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies server/db/migrations (creates the pgvector extension),
  # tracked in drizzle.__drizzle_migrations so re-runs are no-ops.
  migrate:
    build: ./server
    command: ["node", "scripts/migratePg.js"]
    environment:
      DATABASE_URL: postgres://sankalp:sankalp@db:5432/sankalp
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://sankalp:sankalp@db:5432/sankalp
      DATABASE_SSL: "false"
      # Legacy Mongo is optional; unset it so server.js skips the connection.
      MONGO_URI: ""
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-shared-secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started

  ai-service:
    build: ./ai-service
    # Not published on the host: only the API container talks to it.
    expose:
      - "8000"
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgres://sankalp:sankalp@db:5432/sankalp
      DATABASE_SSL: "false"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-shared-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - server

volumes:
  pgdata:
